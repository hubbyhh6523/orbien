listen = "0.0.0.0:9527"

quicPort = 9528
kcpPort = 9529

httpGwPort = 80
httpsGwPort = 443
rootDomain = "example.com"

proxyAddr = "0.0.0.0"
udpPacketSize = 1500

# Deny inbound connections from these source CIDRs (blocklist).
# Applies to tcp/udp tunnels, the control port and the http/https gateways.
# denySrcCidrs = ["10.0.0.0/8", "192.168.0.0/16"]

# Accept PROXY protocol headers from trusted upstreams on the
# tcp/http/https gateways only (not the control port, not udp).
# proxyProtocol = false

# Trust PROXY protocol headers only from these upstream CIDRs.
# proxyProtocolTrustedCidrs = ["10.0.0.1/32"]

[auth]
type = "token"
# The server refuses to start with an empty or placeholder token (#12).
# Generate a real one with: openssl rand -hex 32
token = "YOUR_TOKEN"

# Optional: restrict what each token is allowed to do.
# If token_policies is non-empty, any token NOT listed here is denied.
# [[auth.token_policies]]
# token = "client-token-A"
# allowed_tunnels    = ["ssh", "web"]   # leave empty = no restriction
# allowed_protocols  = ["tcp", "http"]  # leave empty = no restriction
# allowed_remote_ports = [9000, 9001]   # leave empty = no restriction
# allowed_domains    = ["app.example.com", "*.example.org"]  # leave empty = only names under rootDomain

[transport]
tcpMux = true
muxKeepaliveSecs = 30
maxConnPool = 10
heartbeatTimeout = 90

[transport.quic]
keepalivePeriod = 10
maxIdleTimeout = 30
maxIncomingStreams = 1000
# QUIC flow-control windows in bytes (#13). Lower values bound how much
# memory one unauthenticated peer can make the server reserve; raise them
# again for high-bandwidth, high-latency links.
#streamRecvWindow = 1048576
#connRecvWindow = 8388608
#sendWindow = 8388608

# Pre-login and visitor resource limits (#13). All values below are the
# defaults; uncomment to override.
# [limits]
#preLoginTimeoutSecs = 10
#idleTimeoutSecs = 3600
#firstMessageMaxBytes = 4096
#preLoginMaxConns = 512
#preLoginMaxConnsPerIp = 32
#maxWaitingVisitorsPerTunnel = 32
#maxOutstandingDataConns = 8
#poolIdleTtlSecs = 300
# UDP visitor caps and packet rate limits (#14). maxUdpVisitorsPerTunnel
# is the operator cap per tunnel; a client's maxConnections can only
# lower it. The packet rates are 0 = disabled.
#maxUdpVisitorsPerTunnel = 1024
#udpPacketsPerSecPerSource = 1000
#udpPacketsPerSecPerTunnel = 10000

[transport.tls]
force = true
certFile = "./certs/server.crt"
keyFile = "./certs/server.key"
trustedCaFile = "./certs/ca.crt"

[dashboard]
addr = "0.0.0.0"
port = 8020
# REQUIRED when port > 0: set explicit credentials (no built-in defaults).
user = "admin"
password = "CHANGE_ME"
staticDir = ""
# Optional: persist WebAuthn passkeys to this file so registrations survive
# restarts (M3). File is JSON, written atomically with 0600. Empty = disabled.
#passkeyStorePath = "/var/lib/orbien/passkeys.json"
